{% extends 'base.html' %}

{% block content %}
<div class="login-box">
    <h2>Login</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>

    <p>New user? <a href="/accounts/register/">Register</a></p>
</div>
{% endblock %}
