{% extends 'base.html' %}

{% block content %}
<h2>Products</h2>

<div class="product-grid">
    {% for product in products %}
    <div class="product-card">
        <img src="{{ product.image.url }}">
        <h3>{{ product.name }}</h3>
        <p>₹{{ product.price }}</p>
        <a href="/products/{{ product.id }}/">
            <button>View</button>
        </a>
    </div>
    {% endfor %}
</div>
{% endblock %}
