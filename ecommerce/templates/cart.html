{% extends 'base.html' %}

{% block content %}
<h2>Your Cart</h2>

{% if orders %}
<table>
<tr>
    <th>Product</th>
    <th>Price</th>
</tr>

{% for order in orders %}
<tr>
    <td>{{ order.product.name }}</td>
    <td>₹{{ order.total_price }}</td>
</tr>
{% endfor %}
</table>

<a href="/orders/place/">
    <button>Place Order</button>
</a>
{% else %}
<p>Your cart is empty</p>
{% endif %}
{% endblock %}
