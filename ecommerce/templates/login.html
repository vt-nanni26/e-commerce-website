{% extends 'base.html' %}

{% block content %}
<div class="login-box">
    <h2>Login</h2>
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">
    <button>Login</button>
</div>
{% endblock %}
.login-box {
    width: 300px;
    margin: auto;
    background: white;
    padding: 20px;
}
.login-box input {
    width: 100%;
    margin-bottom: 10px;
    padding: 8px;
}
