{% extends 'base.html' %}

{% block content %}
<h2>My Orders</h2>

{% if orders %}
<div class="order-items">
    {% for order in orders %}
    <div class="order-item">
        <div>
            <h3>{{ order.product.name }}</h3>
            <p>Price: ₹{{ order.total_price }}</p>
            <p>Ordered on: {{ order.created_at|date:"M d, Y" }}</p>
        </div>
    </div>
    {% endfor %}
</div>
{% else %}
<p>No orders placed yet.</p>
{% endif %}
{% endblock %}
