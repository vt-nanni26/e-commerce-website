{% extends 'base.html' %}
{% load static %}

{% block content %}
<h1>Product List</h1>

<div class="product-grid">
    {% for product in products %}
    <div class="product-card">
        <img src="{{ product.image.url }}" alt="{{ product.name }}">
        <h3>{{ product.name }}</h3>
        <p class="price">₹{{ product.price }}</p>
        <a href="{{ product.id }}/">
            <button class="btn-view">View Details</button>
        </a>
    </div>
    {% endfor %}
</div>
{% endblock %}
