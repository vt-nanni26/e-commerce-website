<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
</head>
<body>

<h1>Product List</h1>

{% for product in products %}
    <div>
        <h3>{{ product.name }}</h3>
        <p>Price: ₹{{ product.price }}</p>
        <p>{{ product.description }}</p>
        <hr>
    </div>
{% empty %}
    <p>No products available</p>
{% endfor %}

</body>
</html>
